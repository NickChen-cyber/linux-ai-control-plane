services:
  api:
    environment:
      COOKIE_SECURE: "true"

  gateway:
    ports:
      - "${CONTROL_PLANE_IP:-192.168.0.151}:8443:443"
    volumes:
      - ./deploy/nginx-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./secrets/tls/server.crt:/etc/nginx/tls/server.crt:ro
      - ./secrets/tls/server.key:/etc/nginx/tls/server.key:ro
