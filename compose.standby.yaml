name: linux-ai-agent-standby

services:
  postgres-standby:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      PGDATA: /var/lib/postgresql/18/docker
      POSTGRES_DB: ${POSTGRES_DB:-linux_ai}
      POSTGRES_USER: ${POSTGRES_USER:-linux_ai}
      POSTGRES_PRIMARY_HOST: ${POSTGRES_PRIMARY_HOST:?請設定 POSTGRES_PRIMARY_HOST}
      POSTGRES_PRIMARY_PORT: ${POSTGRES_PRIMARY_PORT:-5432}
      POSTGRES_REPLICATION_USER: ${POSTGRES_REPLICATION_USER:-linux_ai_replication}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:?請設定 POSTGRES_REPLICATION_PASSWORD}
      POSTGRES_REPLICATION_SLOT: ${POSTGRES_REPLICATION_SLOT:-linux_ai_standby}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-standby-data:/var/lib/postgresql
      - ./deploy/postgres-standby-entrypoint.sh:/usr/local/bin/postgres-standby-entrypoint.sh:ro
    entrypoint: ["sh", "/usr/local/bin/postgres-standby-entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  postgres-standby-data:
