name: linux-ai-agent

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=5
      - -c
      - max_replication_slots=5
      - -c
      - wal_keep_size=256MB
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-linux_ai}
      POSTGRES_USER: ${POSTGRES_USER:-linux_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linux-ai-lab-only-change-me}
    ports:
      - "${POSTGRES_BIND_IP:-127.0.0.1}:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./backend/sql/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-1g}
    cpus: ${POSTGRES_CPU_LIMIT:-1.5}
    pids_limit: 256

  api:
    build:
      context: ./backend
      network: host
    restart: unless-stopped
    environment:
      PGHOST: postgres
      APP_VERSION: ${APP_VERSION:-3.6.0}
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-linux_ai}
      PGUSER: ${POSTGRES_USER:-linux_ai}
      PGPASSWORD: ${POSTGRES_PASSWORD:-linux-ai-lab-only-change-me}
      INVENTORY_PATH: /app/config/inventory.json
      SSH_KEY_PATH: /run/ssh/linux_ai_agent
      KNOWN_HOSTS_PATH: /run/ssh/known_hosts
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?請先在 .env 設定 ADMIN_PASSWORD}
      ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME:-平台管理員}
      SESSION_HOURS: ${SESSION_HOURS:-8}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MONITOR_INTERVAL_SECONDS: ${MONITOR_INTERVAL_SECONDS:-60}
      METRIC_RETENTION_DAYS: ${METRIC_RETENTION_DAYS:-30}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:-}
      LINE_TARGET_ID: ${LINE_TARGET_ID:-}
      SMS_GATEWAY_URL: ${SMS_GATEWAY_URL:-}
      SMS_GATEWAY_TOKEN: ${SMS_GATEWAY_TOKEN:-}
      SMS_TO_NUMBER: ${SMS_TO_NUMBER:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_WEBHOOK_TOKEN: ${ALERT_WEBHOOK_TOKEN:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TO: ${SMTP_TO:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      NOTIFICATION_TIMEOUT_SECONDS: ${NOTIFICATION_TIMEOUT_SECONDS:-8}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      WATCHDOG_SHARED_TOKEN: ${WATCHDOG_SHARED_TOKEN:-}
      WATCHDOG_STALE_SECONDS: ${WATCHDOG_STALE_SECONDS:-120}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-60}
      AI_DIAGNOSTIC_MODE: ${AI_DIAGNOSTIC_MODE:-local}
      UBUNTU_SECURITY_API_URL: ${UBUNTU_SECURITY_API_URL:-https://ubuntu.com/security/notices.json}
      UBUNTU_SECURITY_CACHE_SECONDS: ${UBUNTU_SECURITY_CACHE_SECONDS:-3600}
      CENTRAL_LOG_INTERVAL_SECONDS: ${CENTRAL_LOG_INTERVAL_SECONDS:-300}
      CENTRAL_LOG_RETENTION_DAYS: ${CENTRAL_LOG_RETENTION_DAYS:-30}
      MAINTENANCE_APPROVAL_TTL_MINUTES: ${MAINTENANCE_APPROVAL_TTL_MINUTES:-60}
      PLATFORM_MASTER_KEY: ${PLATFORM_MASTER_KEY:-}
      API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-240}
      SSH_MAX_CONCURRENCY: ${SSH_MAX_CONCURRENCY:-8}
      CONFIG_REPO_PATH: /var/lib/linux-ai-config
      BACKUP_STORAGE_PATH: /backups
    volumes:
      - ${SSH_KEY_PATH:-/home/nickc/.ssh/linux_ai_agent}:/run/ssh/linux_ai_agent:ro
      # Auto-enrollment appends a fingerprint only after the operator confirms it.
      - ${KNOWN_HOSTS_PATH:-/home/nickc/.ssh/known_hosts}:/run/ssh/known_hosts
      - config-history:/var/lib/linux-ai-config
      - backup-data:/backups:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health')); assert data['databaseReady']"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    mem_limit: ${API_MEMORY_LIMIT:-768m}
    cpus: ${API_CPU_LIMIT:-1.5}
    pids_limit: 256

  backup:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-linux_ai}
      PGUSER: ${POSTGRES_USER:-linux_ai}
      PGPASSWORD: ${POSTGRES_PASSWORD:-linux-ai-lab-only-change-me}
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      BACKUP_POLL_SECONDS: ${BACKUP_POLL_SECONDS:-10}
    volumes:
      - backup-data:/backups
      - config-history:/recovery-input/config-history:ro
      - ${KNOWN_HOSTS_PATH:-/home/nickc/.ssh/known_hosts}:/recovery-input/known_hosts:ro
      - ./deploy/backup-worker.sh:/usr/local/bin/backup-worker.sh:ro
    command: ["sh", "/usr/local/bin/backup-worker.sh"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /backups/.worker-heartbeat && test $$(($$(date +%s)-$$(cat /backups/.worker-heartbeat))) -lt 120"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: ${BACKUP_MEMORY_LIMIT:-512m}
    cpus: ${BACKUP_CPU_LIMIT:-1.0}
    pids_limit: 128

  maintenance-worker:
    build:
      context: ./backend
      network: host
    restart: unless-stopped
    command: ["python", "-m", "app.maintenance_worker"]
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-linux_ai}
      PGUSER: ${POSTGRES_USER:-linux_ai}
      PGPASSWORD: ${POSTGRES_PASSWORD:-linux-ai-lab-only-change-me}
      APP_VERSION: ${APP_VERSION:-3.6.0}
      INVENTORY_PATH: /app/config/inventory.json
      SSH_KEY_PATH: /run/ssh/linux_ai_agent
      KNOWN_HOSTS_PATH: /run/ssh/known_hosts
      PLATFORM_MASTER_KEY: ${PLATFORM_MASTER_KEY:-}
      MAINTENANCE_WORKER_CONCURRENCY: ${MAINTENANCE_WORKER_CONCURRENCY:-2}
      MAINTENANCE_WORKER_POLL_SECONDS: ${MAINTENANCE_WORKER_POLL_SECONDS:-2}
      SSH_MAX_CONCURRENCY: ${SSH_MAX_CONCURRENCY:-8}
    volumes:
      - ${SSH_KEY_PATH:-/home/nickc/.ssh/linux_ai_agent}:/run/ssh/linux_ai_agent:ro
      - ${KNOWN_HOSTS_PATH:-/home/nickc/.ssh/known_hosts}:/run/ssh/known_hosts:ro
    depends_on:
      api:
        condition: service_healthy
    mem_limit: ${WORKER_MEMORY_LIMIT:-512m}
    cpus: ${WORKER_CPU_LIMIT:-1.0}
    pids_limit: 128

  ui:
    build:
      context: .
      network: host
    restart: unless-stopped
    environment:
      CONTROL_PLANE_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    mem_limit: ${UI_MEMORY_LIMIT:-512m}
    cpus: ${UI_CPU_LIMIT:-1.0}
    pids_limit: 128

  gateway:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "${CONTROL_PLANE_IP:-192.168.0.151}:8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ui
      - api
    mem_limit: ${GATEWAY_MEMORY_LIMIT:-128m}
    cpus: ${GATEWAY_CPU_LIMIT:-0.5}
    pids_limit: 64

volumes:
  postgres-data:
  backup-data:
  config-history:
